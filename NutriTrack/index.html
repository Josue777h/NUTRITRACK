<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriTrack - Prototipo React</title>
    
    <!-- Security: X-Content-Type-Options, X-XSS-Protection are best set via server HTTP headers.
         Here we only set what works natively in HTML. -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
    <!-- SEO & Metadata -->
    <meta name="description" content="NutriTrack: Sistema integral de gestión nutricional profesional. Expedientes clínicos, citas, dietas inteligentes y seguimiento en tiempo real.">
    <meta name="theme-color" content="#49b54c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/logonutri.png">
    <link rel="apple-touch-icon" href="/logonutri.png">
    
    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="NutriTrack - Plataforma Nutricional Inteligente">
    <meta property="og:description" content="Sistema de gestión clínica y nutricional profesional para especialistas y pacientes.">
    <meta property="og:type" content="website">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
